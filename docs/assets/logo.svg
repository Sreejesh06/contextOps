<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="gradTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    
    <linearGradient id="gradSpine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    
    <linearGradient id="gradBottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>

    <filter id="glow-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="400" height="400" fill="#020617" rx="60" /> <!-- Dark background with rounded corners for the logo icon -->

  <g transform="translate(80, 120) scale(1.5)">
    <!-- Top Ribbon -->
    <polygon points="0,0 100,-50 160,-20 60,30" fill="url(#gradTop)" opacity="0.95" />
    <!-- Spine Ribbon -->
    <polygon points="0,0 60,30 60,170 0,140" fill="url(#gradSpine)" opacity="0.95" />
    <!-- Bottom Ribbon -->
    <polygon points="0,140 60,170 160,120 100,90" fill="url(#gradBottom)" opacity="0.95" />
    
    <!-- Inner Glowing Core (Data Node) -->
    <polygon points="70,60 110,40 150,60 110,80" fill="#FFFFFF" filter="url(#glow-heavy)" />
    <polygon points="70,60 110,40 150,60 110,80" fill="#FFFFFF" />
  </g>
</svg>
