<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Matching Logo Palette) -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0A1128" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Halftone Texture -->
    <pattern id="halftone" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(20)">
      <circle cx="5" cy="5" r="2.2" fill="#06B6D4" opacity="0.8" />
      <circle cx="1" cy="9" r="1.5" fill="#8B5CF6" opacity="0.6" />
    </pattern>

    <linearGradient id="fadeLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="80%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <mask id="maskLeft">
      <rect x="0" y="0" width="400" height="300" fill="url(#fadeLeft)" />
    </mask>

    <linearGradient id="fadeRight" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="80%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <mask id="maskRight">
      <rect x="800" y="0" width="400" height="300" fill="url(#fadeRight)" />
    </mask>

    <!-- Drop Shadow for 3D Isometric Depth -->
    <filter id="drop-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <linearGradient id="gradTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="gradSpine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="gradBottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>
    <filter id="glow-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Tile Base -->
    <g id="tile-base" filter="url(#drop-shadow)">
      <path d="M 0,-25 L 40,0 L 0,25 L -40,0 Z" fill="#F8FAFC" />
      <path d="M -40,0 L 0,25 L 0,35 L -40,10 Z" fill="#94A3B8" />
      <path d="M 0,25 L 40,0 L 40,10 L 0,35 Z" fill="#475569" />
    </g>

    <!-- 1. GitHub -->
    <g id="tile-gh">
      <use href="#tile-base" />
      <g transform="scale(1, 0.625) rotate(45)">
        <circle cx="0" cy="0" r="15" fill="#1B1F23" />
        <path d="M 0,-8 C -4.5,-8 -8,-4.5 -8,0 C -8,3.5 -5.7,6.5 -2.6,7.6 C -2.2,7.7 -2.0,7.4 -2.0,7.2 L -2.0,5.7 C -4.2,6.2 -4.7,4.6 -4.7,4.6 C -5.0,3.8 -5.5,3.6 -5.5,3.6 C -6.2,3.1 -5.4,3.1 -5.4,3.1 C -4.6,3.2 -4.2,4.0 -4.2,4.0 C -3.5,5.2 -2.4,4.9 -2.0,4.7 C -1.9,4.2 -1.6,3.9 -1.3,3.7 C -3.1,3.5 -5.0,2.8 -5.0,-0.3 C -5.0,-1.2 -4.7,-1.9 -4.2,-2.4 C -4.3,-2.6 -4.5,-3.4 -4.1,-4.3 C -4.1,-4.3 -3.4,-4.5 -2.0,-3.6 C -1.4,-3.8 -0.7,-3.9 0,-3.9 C 0.7,-3.9 1.4,-3.8 2.0,-3.6 C 3.4,-4.5 4.1,-4.3 4.1,-4.3 C 4.5,-3.4 4.3,-2.6 4.2,-2.4 C 4.7,-1.9 5.0,-1.2 5.0,-0.3 C 5.0,2.8 3.1,3.5 1.3,3.7 C 1.6,3.9 1.9,4.4 1.9,4.9 L 1.9,7.2 C 1.9,7.4 2.1,7.7 2.6,7.6 C 5.7,6.5 8.0,3.5 8.0,0 C 8.0,-4.5 4.5,-8 0,-8 Z" fill="#FFFFFF" />
      </g>
    </g>

    <!-- 2. Datadog -->
    <g id="tile-dd">
      <use href="#tile-base" />
      <g transform="scale(1, 0.625) rotate(45)">
        <rect x="-15" y="-15" width="30" height="30" rx="4" fill="#632CA6" />
        <path d="M -7,7 L -7,0 L -2,-4 L 3,0 L 3,7" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round" />
        <circle cx="7" cy="-4" r="2.5" fill="#FFFFFF" />
      </g>
    </g>

    <!-- 3. PagerDuty -->
    <g id="tile-pd">
      <use href="#tile-base" />
      <g transform="scale(1, 0.625) rotate(45)">
        <rect x="-15" y="-15" width="30" height="30" rx="4" fill="#059669" />
        <path d="M-5,-6 L2,-6 C5,-6 7,-4 7,-1 C7,2 5,4 2,4 L-2,4 L-2,8 L-5,8 Z M-2,-3 L-2,1 L2,1 C3,1 4,0 4,-1 C4,-2 3,-3 2,-3 Z" fill="#FFFFFF" />
      </g>
    </g>

    <!-- 4. Slack -->
    <g id="tile-slack">
      <use href="#tile-base" />
      <g transform="scale(1, 0.625) rotate(45)">
        <path d="M 2,-8 C 2,-10 4,-12 6,-12 C 8,-12 10,-10 10,-8 L 10,-2 C 10,0 8,2 6,2 C 4,2 2,0 2,-2 Z" fill="#E01E5A" />
        <circle cx="6" cy="6" r="4" fill="#E01E5A" />
        <path d="M -8,-10 C -10,-10 -12,-8 -12,-6 C -12,-4 -10,-2 -8,-2 L -2,-2 C 0,-2 2,-4 2,-6 C 2,-8 0,-10 -2,-10 Z" fill="#36C5F0" />
        <circle cx="6" cy="-6" r="4" fill="#36C5F0" />
        <path d="M -10,2 C -10,0 -8,-2 -6,-2 C -4,-2 -2,0 -2,2 L -2,8 C -2,10 -4,12 -6,12 C -8,12 -10,10 -10,8 Z" fill="#2EB67E" />
        <circle cx="-6" cy="-6" r="4" fill="#2EB67E" />
        <path d="M 8,10 C 10,10 12,8 12,6 C 12,4 10,2 8,2 L 2,2 C 0,2 -2,4 -2,6 C -2,8 0,10 2,10 Z" fill="#ECB22E" />
        <circle cx="-6" cy="6" r="4" fill="#ECB22E" />
      </g>
    </g>

    <!-- 5. AWS -->
    <g id="tile-aws">
      <use href="#tile-base" />
      <g transform="scale(1, 0.625) rotate(45)">
        <rect x="-15" y="-15" width="30" height="30" rx="4" fill="#232F3E" />
        <text x="0" y="1" font-family="'Inter', sans-serif" font-weight="900" font-size="12" fill="#FFFFFF" text-anchor="middle">aws</text>
        <path d="M -8,4 Q 0,10 8,4" fill="none" stroke="#FF9900" stroke-width="2.5" stroke-linecap="round" />
      </g>
    </g>

    <!-- 6. Grafana -->
    <g id="tile-grafana">
      <use href="#tile-base" />
      <g transform="scale(1, 0.625) rotate(45)">
        <circle cx="0" cy="0" r="14" fill="#181B1F" />
        <path d="M -2,-8 A 10 10 0 0 1 8,-2 L 4,-2 A 6 6 0 0 0 -2,-4 Z" fill="#F47A20" />
        <path d="M 8,2 A 10 10 0 0 1 -2,8 L -2,4 A 6 6 0 0 0 4,2 Z" fill="#FFC933" />
        <path d="M -8,-2 A 10 10 0 0 0 -8,2 L -4,2 A 6 6 0 0 1 -4,-2 Z" fill="#FFC933" />
      </g>
    </g>

    <!-- 7. GitLab -->
    <g id="tile-gl">
      <use href="#tile-base" />
      <g transform="scale(1, 0.625) rotate(45)">
        <rect x="-15" y="-15" width="30" height="30" rx="4" fill="#FFFFFF" stroke="#E24329" stroke-width="1" />
        <path d="M -8,-2 L -4,6 L 4,6 L 8,-2 L 10,4 L 0,12 L -10,4 Z" fill="#E24329" />
        <path d="M -8,-2 L -4,6 L 0,12 Z" fill="#FC6D26" />
        <path d="M 8,-2 L 4,6 L 0,12 Z" fill="#FC6D26" />
        <path d="M -4,6 L 4,6 L 0,12 Z" fill="#FCA326" />
      </g>
    </g>

    <!-- 8. Terminal (CLI / DevOps general) -->
    <g id="tile-term">
      <use href="#tile-base" />
      <g transform="scale(1, 0.625) rotate(45)">
        <rect x="-15" y="-15" width="30" height="30" rx="4" fill="#1E293B" />
        <text x="-12" y="4" font-family="monospace" font-size="16" fill="#4ADE80" font-weight="bold">>_</text>
      </g>
    </g>

  </defs>

  <!-- Render Background -->
  <rect x="0" y="0" width="1200" height="300" fill="url(#bg)" />

  <!-- Render Edge Halftones -->
  <rect x="0" y="0" width="400" height="300" fill="url(#halftone)" mask="url(#maskLeft)" />
  <rect x="800" y="0" width="400" height="300" fill="url(#halftone)" mask="url(#maskRight)" />

  <!-- Left Chevron (DevOps integrations) -->
  <use href="#tile-term" x="70" y="30" />
  <use href="#tile-gh" x="140" y="70" />
  <use href="#tile-pd" x="70" y="70" />
  <use href="#tile-grafana" x="210" y="110" />
  <use href="#tile-aws" x="140" y="110" />
  <use href="#tile-dd" x="70" y="110" />
  <use href="#tile-slack" x="280" y="150" />
  <use href="#tile-gl" x="210" y="150" />
  <use href="#tile-slack" x="140" y="150" />
  <use href="#tile-pd" x="70" y="150" />
  <use href="#tile-pd" x="210" y="190" />
  <use href="#tile-aws" x="140" y="190" />
  <use href="#tile-term" x="70" y="190" />
  <use href="#tile-dd" x="140" y="230" />
  <use href="#tile-gh" x="70" y="230" />
  <use href="#tile-gl" x="70" y="270" />

  <!-- Right Chevron (DevOps integrations) -->
  <use href="#tile-pd" x="1130" y="30" />
  <use href="#tile-dd" x="1060" y="70" />
  <use href="#tile-gh" x="1130" y="70" />
  <use href="#tile-aws" x="990" y="110" />
  <use href="#tile-term" x="1060" y="110" />
  <use href="#tile-slack" x="1130" y="110" />
  <use href="#tile-grafana" x="920" y="150" />
  <use href="#tile-gl" x="990" y="150" />
  <use href="#tile-slack" x="1060" y="150" />
  <use href="#tile-pd" x="1130" y="150" />
  <use href="#tile-gh" x="990" y="190" />
  <use href="#tile-term" x="1060" y="190" />
  <use href="#tile-dd" x="1130" y="190" />
  <use href="#tile-slack" x="1060" y="230" />
  <use href="#tile-aws" x="1130" y="230" />
  <use href="#tile-grafana" x="1130" y="270" />

  <!-- Render Central Typography and New Logo -->
  <!-- Shifted group down slightly to y=140 to balance the overall block -->
  <g transform="translate(600, 140)">
    
    <!-- The New ContextOps Folded Ribbon Logo -->
    <!-- Scaled to 0.5 (smaller) and properly aligned with the text baseline -->
    <g transform="translate(-230, -40) scale(0.5)">
      <polygon points="0,0 100,-50 160,-20 60,30" fill="url(#gradTop)" opacity="0.95" />
      <polygon points="0,0 60,30 60,170 0,140" fill="url(#gradSpine)" opacity="0.95" />
      <polygon points="0,140 60,170 160,120 100,90" fill="url(#gradBottom)" opacity="0.95" />
      <polygon points="70,60 110,40 150,60 110,80" fill="#FFFFFF" filter="url(#glow-heavy)" />
      <polygon points="70,60 110,40 150,60 110,80" fill="#FFFFFF" />
    </g>

    <!-- ContextOps Core Typography -->
    <text x="-120" y="15" font-family="'Inter', system-ui, sans-serif" font-size="64" font-weight="900" fill="#FFFFFF" letter-spacing="-0.04em" text-anchor="start">ContextOps</text>
    
    <!-- Subtitle mapping to the Composio layout, flawlessly spaced and centered -->
    <text x="0" y="85" font-family="'Inter', system-ui, sans-serif" font-size="22" fill="#94A3B8" text-anchor="middle" font-weight="400" letter-spacing="0.01em">
      Context that <tspan font-family="'Playfair Display', Georgia, serif" font-style="italic" font-weight="600" fill="#E2E8F0">resolves</tspan> for your <tspan font-family="'Playfair Display', Georgia, serif" font-style="italic" font-weight="600" fill="#E2E8F0">Engineers</tspan>
    </text>
  </g>
</svg>
